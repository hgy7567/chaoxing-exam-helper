<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#101114">
<title>超星学习助手</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
  <div class="brand">
    <div class="logo">S</div>
    <div>
      <h2>超星学习助手</h2>
      <small>CHAОXING MOBILE</small>
    </div>
  </div>
  <span class="status">● 本地模式</span>
</header>

<main>
  <section class="welcome">
    <p>WELCOME BACK</p>
    <h1>学习管理中心</h1>
    <span>你的移动学习工作台</span>
  </section>

  <section class="overview">
    <div class="card"><span>我的课程</span><strong id="courseCount">0</strong></div>
    <div class="card"><span>学习任务</span><strong id="taskCount">0</strong></div>
  </section>

  <h3>功能中心</h3>
  <section class="grid">
    <button onclick="showPage('courses')">📚<span>课程管理</span></button>
    <button onclick="showPage('tasks')">📋<span>任务管理</span></button>
    <button onclick="showPage('ai')">🤖<span>AI学习助手</span></button>
    <button onclick="showPage('settings')">⚙️<span>模型配置</span></button>
    <button onclick="showPage('logs')">📊<span>运行日志</span></button>
    <button onclick="showPage('about')">ℹ️<span>关于软件</span></button>
  </section>

  <section id="pageContent" class="activity">
    <h3>系统状态</h3>
    <p>运行模式：手机本地模式</p>
    <p>数据存储：本地优先</p>
    <p>服务状态：前端已就绪</p>
  </section>
</main>

<nav>
  <button onclick="showPage('home')">首页</button>
  <button onclick="showPage('courses')">课程</button>
  <button onclick="showPage('tasks')">任务</button>
  <button onclick="showPage('settings')">设置</button>
</nav>

<script src="js/app.js"></script>
</body>
</html>
